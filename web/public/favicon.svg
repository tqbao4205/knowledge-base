<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Apple Signature Blue to Indigo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ED" />
      <stop offset="50%" stop-color="#0062D2" />
      <stop offset="100%" stop-color="#5856D6" />
    </linearGradient>

    <!-- Inner Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.12)" />
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E1F2FF" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#001438" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- macOS App Squircle Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Subtle Top Gloss Sheen -->
  <path d="M 2 16 C 2 8.27 8.27 2 16 2 L 48 2 C 55.73 2 62 8.27 62 16 C 62 26 50 32 32 32 C 14 32 2 26 2 16 Z" fill="rgba(255, 255, 255, 0.09)" />

  <!-- Knowledge Document & AI Sparkle Group -->
  <g filter="url(#iconShadow)">
    <!-- Behind sheet for layered depth -->
    <rect x="15" y="14" width="26" height="34" rx="3.5" fill="rgba(255, 255, 255, 0.32)" />

    <!-- Main white document card -->
    <rect x="18" y="17" width="28" height="34" rx="4" fill="#FFFFFF" />

    <!-- Document Content Indicator Lines -->
    <rect x="23" y="23" width="18" height="2.5" rx="1.25" fill="#0071E3" opacity="0.9" />
    <rect x="23" y="28.5" width="13" height="2.2" rx="1.1" fill="#86868B" opacity="0.65" />
    <rect x="23" y="33.5" width="16" height="2.2" rx="1.1" fill="#86868B" opacity="0.65" />

    <!-- AI Intelligence 4-Point Sparkle Star -->
    <path d="M 43 28 C 43 35.5 38.5 40 31 40 C 38.5 40 43 44.5 43 52 C 43 44.5 47.5 40 55 40 C 47.5 40 43 35.5 43 28 Z" fill="url(#starGrad)" stroke="#0071E3" stroke-width="0.8" />
    <!-- Center Dot Highlight -->
    <circle cx="43" cy="40" r="1.5" fill="#0071E3" />
  </g>
</svg>